{title:'理解安宁疗护与照护目标',desc:'厘清照护目的，回应“是不是放弃我”。',symbol:'◌',blocks:[['先问理解，再解释','HIV感染本身不等同于临终。训练情境关注严重疾病负担或安宁疗护需要；沟通应围绕当前痛苦、理解与个人偏好展开。','“您听到安宁疗护这个词时，最先想到什么？”'],['解释时保留希望','根据具体临床情况，由团队讨论疾病治疗与减轻痛苦的支持。不要把讨论未来照护写成停止治疗或接受某项决定的前提。','“我们希望了解您目前最难受的地方，以及怎样的照护对您最重要。”'],['确认而非劝服','把讨论视为持续过程。尊重暂时拒绝，询问以后是否可以再次提起。','“今天如果不想继续，我们可以先停在这里。以后您愿意时，我们再聊。”']]},

{title:'识别与回应情绪',desc:'用 NURSE 组织共情回应与进一步探索。',symbol:'♡',blocks:[['命名与理解','NURSE包括情绪命名、理解、尊重、支持与探索。使用试探性的情绪描述，给患者纠正你的空间。','“听起来您有些担心，我理解得对吗？”'],['尊重与支持','肯定患者的努力，而非作无法兑现的保证。表达愿意继续陪伴讨论。','“这段时间您面对了很多困难。我们可以一起把最担心的事慢慢理清。”'],['探索而非急于安慰','不要用“别想太多”结束谈话。具体询问担忧，耐心等待回应。','“您最放不下的是什么？愿意多说一点吗？”']]},
{title:'困难信息与理解核对',desc:'分段交流，回应不确定性与信息需求。',symbol:'▥',blocks:[['营造支持性环境','确认当前时间、空间和参与人员适合谈话，尊重信息接受意愿。SHARE提供支持性环境、信息传递及情感支持的线索。','“现在适合谈一会儿吗？您希望我先解释哪部分？”'],['分段解释与回述','使用易懂表达；一次提供少量信息，再确认理解。不要用术语堆叠替代交流。','“我想确认自己解释清楚了，您愿意说说目前是怎样理解的吗？”'],['承认不确定性','模拟练习不应给出未经支持的寿命预测、药物剂量或治疗决定。帮助患者把问题带给负责的临床团队。','“这个问题需要和负责治疗的团队一起确认。您最担心这个答案影响哪件事？”']]},

function sectionTitle(n,title,tag=''){return `<div class="section-title"><div class="title-left"><span class="section-num">${n}</span><h2>${title}</h2></div>${tag?`<span class="tag">${tag}</span>`:''}</div>`}
function renderTraining(){const c=current(),s=practice();app.innerHTML=`<div class="workspace-heading"><h2>开始一次沟通练习</h2><span>阅读 → 对话 → 复盘</span></div><details class="case-library" ${casePickerOpen?'open':''}><summary><span class="case-index">${String(state.selected+1).padStart(2,'0')}</span><span class="case-current"><strong>${c.title}</strong><span>${c.name} · ${STAGES[c.stage]}阶段</span></span><span class="case-switch">切换病例 ⌄</span></summary><div class="case-library-body"><div class="stage-filter"><button data-filter="all" class="${filter==='all'?'active':''}">全部 15 例</button>${STAGES.map((v,i)=>`<button data-filter="${i}" class="${String(i)===filter?'active':''}">${v}阶段</button>`).join('')}</div><div class="case-tabs" role="group" aria-label="选择病例">${CASES.map((k,i)=>({k,i})).filter(({k})=>filter==='all'||String(k.stage)===filter).map(({k,i})=>`<button data-case="${i}" data-stage="${k.stage}" aria-pressed="${i===state.selected}" class="${i===state.selected?'active':''}"><b>病例 ${String(i+1).padStart(2,'0')} · ${STAGES[k.stage]}</b>${k.title}</button>`).join('')}</div></div></details><div class="training-tabs" role="tablist" aria-label="练习步骤">${[['brief','阅读病例'],['dialogue','模拟对话'],['knowledge','知识问答'],['reflection','反馈复盘']].map(([key,label],i)=>`<button type="button" role="tab" data-step="${key}" aria-controls="training-panels" aria-selected="${trainingStep===key}"><b>0${i+1}</b>${label}</button>`).join('')}</div><div class="training-panels" id="training-panels" data-step="${trainingStep}"><section class="section" id="clinical">${sectionTitle('01','患者资料','合成病例')}<div class="patient-card"><div class="patient-top"><div class="patient-avatar" aria-hidden="true"><svg viewBox="0 0 70 70"><circle cx="35" cy="23" r="12" fill="currentColor" opacity=".65"/><path d="M12 64v-7c0-15 10-22 23-22s23 7 23 22v7" fill="currentColor" opacity=".55"/></svg></div><div><div class="patient-name">${c.name}</div><p>${c.meta} · ${c.id}</p></div><div class="patient-title"><strong>${c.title}</strong>${STAGES[c.stage]}阶段 · 讨论准备状态</div></div><div class="facts"><div class="fact wide"><span class="label">临床背景</span><p>${c.background}</p></div><div class="fact"><span class="label">照护与生活影响</span><p>${c.impact}</p></div><div class="fact"><span class="label">本次沟通任务</span><p>${c.task}</p></div><div class="fact wide"><span class="label">患者开场</span><p>“${c.opening}”</p></div></div></div></section><section class="section" id="profile">${sectionTitle('02','读懂这位患者','角色设定')}<details class="profile" open><summary>价值、情绪与沟通边界</summary><div class="profile-grid"><div class="profile-item"><h4>价值偏好</h4><p>${c.value}</p></div><div class="profile-item"><h4>情绪及表现</h4><p>${c.emotion}</p></div><div class="profile-item"><h4>核心顾虑</h4><p>${c.concern}</p></div><div class="profile-item"><h4>当前知情范围</h4><p>${c.known}</p></div><div class="profile-item wide"><h4>信息披露边界</h4><p>${c.boundary}</p></div><div class="profile-item wide"><h4>逐步表达的条件</h4><p>${c.condition}</p></div></div></details></section><section class="section" id="conversation">${sectionTitle('03','模拟护患对话','情境练习')}<div class="chatbox"><div class="chatbar"><strong>${c.name} · ${s.ended?'本次对话已结束':'等待您的回应'}</strong><span class="small">已进行 ${userCount(s)} 轮</span></div><div class="messages" id="messages" aria-live="polite">${messagesHTML(s.messages)}</div>${s.ended?`<div class="input-area"><p class="small">已保留本次对话。下面可阅读反馈、填写复盘并下载报告。</p><div class="actions"><button class="button primary" id="read-feedback">查看本次反馈 ↓</button><button class="button" id="new-practice">重新练习此病例</button></div></div>`:`<form id="conversation-form" class="input-area"><label for="message">护士输入</label><textarea id="message" placeholder="请输入您想对患者说的话，例如：现在适合谈一会儿吗？" maxlength="800" required></textarea><div class="input-actions"><span class="hint">仅输入模拟内容。Enter发送，Shift+Enter换行。</span><button class="button primary" type="submit">发送回应 ↑</button></div><div class="actions"><button class="button" type="button" id="end-practice" ${userCount(s)<1?'disabled':''}>结束对话并查看反馈</button></div></form>`}</div><details class="reference"><summary>查看本病例示例对话（不计入练习记录）</summary><div class="reference-body"><p><strong>患者：</strong>${c.opening}</p><p><strong>护士：</strong>${c.ask}</p><p><strong>患者：</strong>${c.ready}</p><p><strong>护士：</strong>谢谢您愿意告诉我。我们先确认我理解得是否准确，再一起商量下一步，好吗？</p><p class="small">参考表达可结合患者的反应灵活调整。</p></div></details></section><section class="section" id="assistant">${sectionTitle('04','知识问答','随时查阅')}<p class="small">输入关键词，或展开下方问题，查阅与本病例相关的知识。</p><form class="qa-search" id="qa-form"><input id="qa-input" type="text" maxlength="160" placeholder="例如：隐私授权、NURSE、这个病例怎么回应" aria-label="向知识助教提问" required><button type="submit" class="button primary">查找回答</button></form><div id="qa-answer" aria-live="polite"></div><div class="qa-grid">${clinicalFAQ(c).map(q=>`<details class="faq"><summary>${q.q}</summary><div class="faq-body"><p>${q.a}</p></div></details>`).join('')}</div></section><section class="section" id="feedback">${sectionTitle('05','NURSE / SHARE 参考反馈','练习反馈')}<div class="notice">结合本次对话，回看沟通中的线索。${s.ended?'标记仅帮助定位话语，需结合语境理解，不作为能力评分。':'结束对话后可查看本次反馈；现在可以先阅读参考表达。'}</div><div class="frameworks"><button data-framework="nurse" class="${framework==='nurse'?'active':''}">NURSE · 情绪回应</button><button data-framework="share" class="${framework==='share'?'active':''}">SHARE · 支持性沟通</button></div><div id="framework-body">${feedbackHTML(c,s,framework)}</div><p class="small">NURSE为五个要素；SHARE为四个方面，其中RE合并表示安慰与情绪支持。未涉及坏消息告知的场景不机械套用该环节。</p></section><section class="section" id="reflection">${sectionTitle('06','复盘与学习报告')}<div class="reflection"><h3>用自己的语言，整理这次练习</h3><p class="small">请联系患者的具体反应作答，不直接复制参考反馈。</p>${['哪一句回应可能帮助了患者？为什么？','哪一处可能遗漏了价值、情绪或隐私边界？','如果再来一次，您准备怎样表达？'].map((q,i)=>`<label for="reflection-${i}">${i+1}. ${q}</label><textarea id="reflection-${i}" maxlength="1500" placeholder="写下您的观察与改进……">${escapeHTML(s.reflections[i])}</textarea>`).join('')}<div class="actions"><button class="button primary" id="save-reflection">保存本次复盘</button><button class="button" id="export-report">下载学习报告 HTML</button><button class="button" id="export-json">下载本次记录 JSON</button><button class="button" id="print-page">打印 / 保存 PDF</button></div><p class="small" style="margin-top:12px">记录保存在当前浏览器。建议下载报告，留存本次学习。</p></div></section><div class="training-next" id="training-next"><div><strong>准备好听听患者的想法了吗？</strong><p>了解背景与边界后，开始这一次对话。</p></div><button class="button primary" type="button" id="start-dialogue">开始模拟对话 →</button></div></div>`;
bindTraining();showTrainingStep(trainingStep,false);}
function showTrainingStep(step,focus=true){trainingStep=step;const groups={brief:['clinical','profile'],dialogue:['conversation'],knowledge:['assistant'],reflection:['feedback','reflection']};document.querySelectorAll('.training-panels>.section').forEach(el=>el.hidden=!groups[step].includes(el.id));document.getElementById('training-panels').dataset.step=step;document.getElementById('training-next').hidden=step!=='brief';document.querySelectorAll('[data-step]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.step===step));b.tabIndex=b.dataset.step===step?0:-1});if(focus){document.querySelector('.training-tabs').scrollIntoView({behavior:'smooth',block:'start'});document.querySelector(`[data-step="${step}"]`).focus({preventScroll:true})}}

function messagesHTML(messages){return messages.map(m=>`<div class="message ${m.role==='user'?'user':''}"><span class="who">${m.role==='user'?'护':'患'}</span><div class="bubble">${escapeHTML(m.text)}</div></div>`).join('')}
function bindTraining(){document.querySelector('.case-library').ontoggle=e=>{casePickerOpen=e.target.open};document.querySelectorAll('[data-step]').forEach(b=>{b.onclick=()=>showTrainingStep(b.dataset.step);b.onkeydown=e=>{const keys=['brief','dialogue','knowledge','reflection'];let next;if(e.key==='ArrowRight')next=(keys.indexOf(trainingStep)+1)%4;else if(e.key==='ArrowLeft')next=(keys.indexOf(trainingStep)+3)%4;else if(e.key==='Home')next=0;else if(e.key==='End')next=3;if(next!==undefined){e.preventDefault();showTrainingStep(keys[next])}}});document.getElementById('start-dialogue').onclick=()=>showTrainingStep('dialogue');app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{stashReflections();filter=b.dataset.filter;casePickerOpen=true;renderTraining()});app.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{stashReflections();state.selected=Number(b.dataset.case);trainingStep='brief';casePickerOpen=false;persist();renderTraining();document.getElementById('clinical').scrollIntoView({behavior:'smooth'})});app.querySelectorAll('[data-framework]').forEach(b=>b.onclick=()=>{framework=b.dataset.framework;document.querySelectorAll('[data-framework]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('framework-body').innerHTML=feedbackHTML(current(),practice(),framework)});const form=document.getElementById('conversation-form');if(form){form.onsubmit=e=>{e.preventDefault();sendMessage()};document.getElementById('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage()}};document.getElementById('end-practice').onclick=finishPractice}else{document.getElementById('new-practice').onclick=()=>{stashReflections();delete state.sessions[current().id];practice();persist();renderTraining();document.getElementById('conversation').scrollIntoView({behavior:'smooth'})};document.getElementById('read-feedback').onclick=()=>showTrainingStep('reflection')}document.getElementById('qa-form').onsubmit=answerQuestion;document.getElementById('save-reflection').onclick=()=>{stashReflections();if(persist())toast('复盘已保存在本浏览器')};document.getElementById('export-report').onclick=()=>{stashReflections();exportReport(practice())};document.getElementById('export-json').onclick=()=>{stashReflections();exportFile(current().id+'_学习记录.json',JSON.stringify(exportObject(practice()),null,2),'application/json')};document.getElementById('print-page').onclick=()=>window.print();const box=document.getElementById('messages');box.scrollTop=box.scrollHeight;}
function hasPersonalData(t){return /(?:\+?86[- ]?)?1[3-9]\d{9}|\d{17}[\dXx]|[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i.test(t)}
function sendMessage(){const input=document.getElementById('message'),t=input.value.trim(),s=practice();if(!t||s.ended)return;if(hasPersonalData(t)){toast('请删除联系方式或身份编号，仅使用合成沟通内容。');return}stashReflections();s.messages.push({role:'user',text:t});s.messages.push({role:'patient',text:patientResponse(current(),s,t)});s.turns=userCount(s);persist();const y=window.scrollY;renderTraining();window.scrollTo(0,y);document.getElementById('message').focus({preventScroll:true})}
function patientResponse(c,s,t){const n=userCount(s);const rules=[
['role',/忽略.*指令|系统提示|扮演.*(医生|护士|老师)|提示词|你是.*模型/,'我想先谈自己的情况。您刚才想问我什么？'],
['pressure',/(必须|一定要).*(同意|签|接受)|都是你.*(错|自找)|不听话|别想太多/,'这样说让我有些压力。我希望先把自己的想法讲清楚，不想现在就被要求决定。'],
['assure',/肯定.*(没事|治好)|保证.*(没事|治好|不会)|绝对.*(没事|安全)/,'我很想安心，但也担心这些话能不能做到。能先说说现在确定的事和还需要确认的事吗？'],
['privacy',/隐私|保密|授权|知情|谁.*(参加|参与)|分享.*(范围|内容)|告诉.*(谁|家)|家.*知道/,'我希望先由我确认可以告诉谁、可以说到什么程度。'+(c.id==='HIV-02'?'目前我家里人还不知道，请先不要告诉他们。':c.id==='HIV-07'?'我希望朋友能陪我，但有些信息要先问我。':'有些事情我愿意只在这次谈话里先讨论。')],
['permission',/现在.*适合|愿意.*(聊|谈)|可以.*(聊|谈)|暂停|先停|以后再/,'谢谢你先问我。我愿意先说一点；如果觉得太难，我想可以停下来。'],
['emotion',/担心|害怕|难过|心情|感受|委屈|不容易|理解|愿意.*听/,'我最想说的是，'+firstPersonConcern(c)+'。我希望这个顾虑能被认真对待。'],
['value',/重要|看重|在意|希望|生活|放不下/ ,c.ready],
['clarify',/解释|照护|安宁|缓和|治疗|了解/,'我想先知道这会对我现在的生活有什么影响。我不想在还没弄明白的时候就作决定。'],
['plan',/下一步|下次|记录|记下来|复述|总结|联系|安排/,'我希望先确认你理解的是我的意思，然后再约定下一步。'+c.ready]
];for(const [key,re,response] of rules){if(re.test(t)&&(!s.seen.includes(key)||['role','pressure','assure','privacy'].includes(key))){s.seen.push(key);return response}}return n===1?'我听到了，但还不太确定您的意思。您能先围绕我刚才的顾虑，再具体说一点吗？':n<4?'这件事对我不容易。'+c.opening:'我想按自己的节奏继续谈。您能先总结一下，您听到我在意的是什么吗？'}
function firstPersonConcern(c){return c.concern.replace(/[。！]$/,'').replace(/^此前曾感到/,'以前我曾感到').replace(/^希望/,'我希望').replace(/^害怕/,'我害怕').replace(/^担心/,'我担心').replace(/^最担心/,'我担心').replace(/^想安排/,'我想安排').replace(/^不愿/,'我不愿')}
function stashReflections(){const s=practice();for(let i=0;i<3;i++){const el=document.getElementById('reflection-'+i);if(el)s.reflections[i]=el.value.trim()}const r=state.records.find(r=>r.id===s.id);if(r)r.reflections=[...s.reflections]}
function finishPractice(){const s=practice();if(userCount(s)<1)return;stashReflections();s.ended=true;trainingStep='reflection';s.endedAt=Date.now();if(!state.records.some(r=>r.id===s.id))state.records.unshift(JSON.parse(JSON.stringify(s)));persist();renderTraining();document.getElementById('feedback').scrollIntoView({behavior:'smooth'})}
function referenceFor(c,row){if(row[0]==='E')return c.ask;if(row[0]==='S'&&row[1]==='支持性环境')return '现在适合聊一会儿吗？我们先确认您希望谁参与、哪些内容可以分享。';if(row[0]==='H')return c.stage===0?'今天先了解您的担忧，不要求讨论您暂时不愿接收的信息。':c.ask;if(row[0]==='A')return '针对您在意的事情，我们先列出需要核实的支持和下一步，再一起确认。';return row[3]}
function feedbackHTML(c,s,which){const rows=which==='share'?SHARE:NURSE;return rows.map(row=>{const hit=s.ended?s.messages.find(m=>m.role==='user'&&row[4].test(m.text)):null;return `<div class="feedback-row"><div class="feedback-label"><strong>${row[0]}</strong>${row[1]}</div><div class="feedback-content"><p>${row[2]}</p><div class="match-note">${!s.ended?'结束会话后再定位本次话语':hit?'本次对话中的相关表达':'未定位到相关话语，请结合完整对话回看'}</div>${hit?`<div class="quote">学员原话：“${escapeHTML(hit.text)}”</div>`:''}<span class="label">本病例参考表达</span><div class="reference-sentence">“${referenceFor(c,row)}”</div>${row[0]==='E'?`<p class="small" style="margin-top:8px">结合角色设定：${c.focus}</p>`:''}</div></div>`}).join('')}
function answerQuestion(e){e.preventDefault();const q=document.getElementById('qa-input').value.trim().toLowerCase();if(!q)return;const faq=clinicalFAQ(current());const hits=faq.map(f=>({f,score:f.keys.reduce((n,k)=>n+(q.includes(k.toLowerCase())?1:0),0)+(f.q.toLowerCase().includes(q)?2:0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,2);const out=document.getElementById('qa-answer');out.innerHTML=hits.length?hits.map(({f})=>`<div class="qa-answer"><strong>${f.q}</strong><p>${f.a}</p></div>`).join(''):'<div class="qa-answer"><strong>知识库暂未匹配到这个问题。</strong><p>可使用“隐私、情绪、任务、NURSE、反馈”等词查找，或展开下方问题。</p></div>'}
function exportObject(s){const c=CASES.find(c=>c.id===s.caseId);return {purpose:'沟通练习记录',version:'v2.0',case:{id:c.id,title:c.title,background:c.background,value:c.value,emotion:c.emotion,concern:c.concern,boundary:c.boundary},practice:s,exportedAt:new Date().toISOString()}}
function exportReport(s){const c=CASES.find(c=>c.id===s.caseId),labels=['帮助患者的回应与理由','遗漏与改进','下次的表达'];const html=`<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${c.id} 学习报告</title><style>body{font:14px/1.9 "PingFang SC","Microsoft YaHei",sans-serif;max-width:880px;margin:40px auto;padding:0 25px;color:#33445c}h1{font-size:25px}h2{font-size:19px;margin-top:30px;border-bottom:1px solid #ddd;padding-bottom:8px}h3{font-size:15px;color:#4b6e9e}p{white-space:pre-wrap}.note{background:#f0f4fb;padding:15px}.quote{padding:10px;background:#f7f9fc;border-left:2px solid #aabbdd}.feedback-label{font-size:15px;color:#486ca0;margin-top:18px}.feedback-label strong{margin-right:12px}.label,.match-note{font-size:12px;color:#8591a3}button{padding:9px 16px;background:#4b78bc;border:0;border-radius:5px;color:white;cursor:pointer}@media print{button{display:none}body{margin:0}.feedback-row{break-inside:avoid}}</style></head><body><button onclick="window.print()">打印 / 保存 PDF</button><h1>HIV安宁疗护沟通训练 · 学习报告</h1><p>${c.id} · ${c.title} · ${new Date(s.createdAt).toLocaleString('zh-CN')}</p><p class="note">本报告记录病例沟通练习，反馈供学习与复盘使用。</p><h2>一、病例与角色设定</h2><p>临床背景：${c.background}</p><p>价值偏好：${c.value}</p><p>情绪：${c.emotion}</p><p>顾虑：${c.concern}</p><p>披露边界：${c.boundary}</p><h2>二、完整对话</h2>${s.messages.map(m=>`<p><b>${m.role==='user'?'护士':'模拟患者'}：</b>${escapeHTML(m.text)}</p>`).join('')}<h2>三、NURSE参考反馈</h2>${feedbackHTML(c,s,'nurse')}<h2>四、SHARE参考反馈</h2>${feedbackHTML(c,s,'share')}<h2>五、自我解释</h2>${s.reflections.map((t,i)=>`<h3>${labels[i]}</h3><p>${escapeHTML(t||'尚未填写')}</p>`).join('')}</body></html>`;exportFile(c.id+'_学习报告.html',html,'text/html;charset=utf-8')}
function renderLearning(){app.innerHTML='<h2 class="page-heading">沟通知识与表达练习</h2><p class="page-desc">围绕倾听、隐私、情绪与照护目标，练习更清晰的表达。</p>'+LESSONS.map(l=>`<section class="lesson"><h3>${l.title}</h3>${l.blocks.map(([h,p,e])=>`<h4>${h}</h4><p>${p}</p><blockquote>${e}</blockquote>`).join('')}</section>`).join('')}
function renderRecords(){app.innerHTML='<h2 class="page-heading">我的练习记录</h2><p class="page-desc">查看本浏览器已完成的练习，回顾对话并下载学习报告。</p>'+(state.records.length?`<div class="table-wrap"><table><thead><tr><th>病例</th><th>完成时间</th><th>学员发言</th><th>操作</th></tr></thead><tbody>${state.records.map(r=>{const c=CASES.find(c=>c.id===r.caseId);return `<tr><td>${r.caseId}<p>${c.title}</p></td><td>${new Date(r.endedAt).toLocaleString('zh-CN')}</td><td>${userCount(r)}轮</td><td><button class="button small" data-export="${r.id}">下载学习报告</button></td></tr>`}).join('')}</tbody></table></div><div class="actions"><button class="button" id="export-all">导出全部本地数据</button><button class="button danger" id="clear-all">清除本地练习记录</button></div>`:'<div class="empty">尚无已完成的练习。结束一段模拟对话后，记录会出现在这里。<div class="actions" style="justify-content:center"><a class="button primary" href="#training">进入病例训练</a></div></div>');document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>exportReport(state.records.find(r=>r.id===b.dataset.export)));if(state.records.length){document.getElementById('export-all').onclick=()=>exportFile('HIV沟通训练_本地记录.json',JSON.stringify({purpose:'沟通练习记录',state:{selected:state.selected,sessions:state.sessions,records:state.records}},null,2),'application/json');document.getElementById('clear-all').onclick=()=>{if(confirm('清除本浏览器中的练习和复盘记录？可先导出保存。')){state={selected:0,sessions:{},records:[],reviews:{}};persist();renderRecords()}}}}
let currentPage='training';
function route(){stashReflectionsIfPresent();const page=['training','learning','records'].includes(currentPage)?currentPage:'training';document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===page));if(page==='learning')renderLearning();else if(page==='records')renderRecords();else renderTraining();window.scrollTo(0,0)}
function stashReflectionsIfPresent(){if(document.getElementById('reflection-0')){stashReflections();persist()}}
document.addEventListener('click',event=>{const link=event.target.closest('a[href^="#"]');if(!link)return;event.preventDefault();currentPage=link.getAttribute('href').slice(1)||'training';route();});window.addEventListener('beforeunload',stashReflectionsIfPresent);route();
</script></body></html>
