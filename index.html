body{min-height:720px}</style></head><body><header><a class="brand" href="#training"><span class="brand-mark">✚</span>护理沟通训练<span class="version">HIV · 安宁疗护</span></a><div class="offline-badge"><span></span>无需登录 · 无需 GPT</div></header><div class="page"><div class="intro"><div class="eyebrow">NURSING COMMUNICATION PRACTICE</div><h1>HIV 安宁疗护沟通训练</h1><p>阅读病例，理解患者的想法，练习每一次有依据的回应。</p></div><nav aria-label="页面导航"><a href="#training" data-nav="training">病例训练</a><a href="#learning" data-nav="learning">知识学习</a><a href="#research" data-nav="research">研究资料</a><a href="#evidence" data-nav="evidence">文献依据</a><a href="#records" data-nav="records">我的记录</a></nav><main id="app"></main><footer><span>教学演示 v2.0 · 合成病例与内容待专家审核</span><span>本地交互与存储 · 不调用外部模型</span></footer></div><div id="toast" role="status"></div><script>const STAGES=['前意向','意向','准备','行动','维持'];
const CASE_SEEDS=[
['01',0,'先听见“不要谈”','周先生','46岁 · 住院','反复住院带来明显的疲惫。已知HIV感染，仍在接受疾病治疗。','我现在不想谈以后，你们是不是觉得我没希望了？','回应拒绝讨论；解释照护目的；征询再次讨论的许可。','最担心一谈安宁疗护就会停止目前的治疗。','如果你们不是要停止治疗，我愿意先听一点，今天不要谈太多。'],
['02',0,'先确认谁可以知道','林女士','39岁 · 门诊','因疾病和照护负担接受随访，家人尚不知道其HIV感染情况。','你不会把我的情况告诉我家里人吧？','核对知情范围；明确沟通授权；尊重支持者选择。','害怕感染信息被转告家人，失去居住与关系支持。','我想先自己谈。以后如果需要陪伴，我希望找我的朋友。'],
['03',0,'沉默背后的顾虑','陈先生','57岁 · 住院','合并严重慢性病，近来与医护交谈减少。','……我不知道要说什么。','允许沉默；开放询问顾虑；避免急于提供建议。','此前曾感到被评判，担心再被贴标签。','你愿意听，我就说一点。我最怕别人觉得这些都是我自找的。'],
['04',1,'治疗与舒适能否并行','何女士','51岁 · 住院','持续接受疾病治疗，同时存在明显症状负担。','我想舒服一点，可我还想继续治疗，这会冲突吗？','了解病情认知；解释支持性照护；确认理解。','担心减轻痛苦与继续治疗只能二选一。','如果能一起讨论，我想先弄明白能得到哪些帮助。'],
['05',1,'当家属想替他决定','吴先生','63岁 · 住院','合并限寿性疾病，家属希望参与讨论，患者尚未明确同意。','家里人说听他们安排就好，可我还有自己的想法。','征询家属参与授权；探索价值；保留患者表达空间。','不愿给家人添麻烦，但不想失去决定权。','我希望先把我的想法说清楚，再决定哪些事和家人一起谈。'],
['06',1,'不确定的未来','赵女士','44岁 · 门诊','经历多次治疗调整，对未来充满担忧。','你能不能告诉我，我到底还有多久？','承认不确定性；探索提问背后的担忧；不虚构预后。','想安排孩子的照顾，但害怕听到具体期限。','我问这个，是因为一直放不下孩子，不只是想知道一个数字。'],
['07',2,'邀请信任的支持者','许先生','49岁 · 门诊','愿意进一步讨论照护偏好，希望亲近朋友提供支持。','我可以带朋友来吗？有些事情我不想让父母知道。','识别患者选择的支持者；约定参与范围；安排后续会谈。','希望朋友参与，却不希望扩大身份知情范围。','可以让朋友了解我的照护想法，但感染的事请先和我确认。'],
['08',2,'谈清楚最看重什么','陆女士','58岁 · 住院','症状与治疗负担影响生活，开始思考未来照护。','如果情况变差，我不知道该怎么选。','探索生活价值；理解权衡；避免替患者选择。','希望保持清醒并与重要的人交流。','能和我在乎的人说话，对我来说很重要。'],
['09',2,'为下一次谈话做准备','孙先生','54岁 · 门诊','愿意讨论未来照护，但对相关概念和流程不了解。','我愿意了解，可我不知道该准备些什么。','分段解释；确认信息需求；形成可行的下一步。','担心必须立即签署文件或作出最终决定。','如果可以慢慢想，我愿意把在意的事情先记下来。'],
['10',3,'把偏好表达清楚','丁女士','60岁 · 住院','已讨论过照护目标，希望把想法告诉照护团队。','我说过的那些想法，你们真的会记下来吗？','复述偏好；核对准确性；解释记录与团队交接。','担心不同班次人员不了解自己的意愿。','请先读给我听，我想确认你们记下的是我的意思。'],
['11',3,'面对家人的不同意见','孟先生','52岁 · 家庭会议','患者同意家属参加限定范围的照护目标讨论。','我知道家里人是为我好，可他们和我想的不一样。','理解双方顾虑；保护患者声音；协商继续沟通。','希望关系得到支持，同时不被迫同意家人的选择。','我希望你能帮我把理由说清楚，不是让谁输谁赢。'],
['12',3,'从谈话到照护安排','叶女士','66岁 · 出院前','已提出照护偏好，需要与团队讨论出院后的衔接。','出院以后遇到问题，我该找谁？','明确后续联系；核对支持资源；回述计划。','担心出院后求助无门，家人无法独自应对。','我想把联系谁、什么时候再谈这些事都确认好。'],
['13',4,'重新确认原来的想法','顾先生','56岁 · 随访','此前表达过照护偏好，目前病情与生活情况有所变化。','以前说的想法，现在还能改吗？','确认偏好可更新；了解变化原因；安排重新记录。','害怕既往记录锁定了之后的选择。','最近的经历让我有了不同想法，我想重新说说。'],
['14',4,'支持关系发生变化','姚女士','47岁 · 门诊','原先选择的支持者暂时无法继续参与照护。','以前陪我的人最近来不了了，我不知道怎么办。','重新识别支持网络；核对新授权；协调团队支持。','担心失去支持后被迫向更多人披露感染信息。','我希望先了解还有哪些帮助，再决定要不要告诉其他人。'],

const LESSONS=[
{title:'理解安宁疗护与照护目标',desc:'厘清照护目的，回应“是不是放弃我”。',symbol:'◌',blocks:[['先问理解，再解释','HIV感染本身不等同于临终。训练情境关注严重疾病负担或安宁疗护需要；沟通应围绕当前痛苦、理解与个人偏好展开。','“您听到安宁疗护这个词时，最先想到什么？”'],['解释时保留希望','根据具体临床情况，由团队讨论疾病治疗与减轻痛苦的支持。不要把讨论未来照护写成停止治疗或接受某项决定的前提。','“我们希望了解您目前最难受的地方，以及怎样的照护对您最重要。”'],['确认而非劝服','把讨论视为持续过程。尊重暂时拒绝，询问以后是否可以再次提起。','“今天如果不想继续，我们可以先停在这里。以后您愿意时，我们再聊。”']],source:'课题文档第1、3节；WHO Palliative care；Tan等（2025）'},
{title:'隐私授权与支持者参与',desc:'理解污名顾虑，先确认谁可以参与。',symbol:'◇',blocks:[['先了解知情范围','合成病例会预设身份知情范围。开始家庭讨论前，询问患者希望谁参与、可以交流哪些内容。','“您希望谁和我们一起谈？哪些内容您希望先只和我讨论？”'],['不预设家属拥有全部信息','亲属关系不替代患者的授权。支持者也可以是患者信任的朋友；具体沟通与记录遵循机构规范。','“在邀请家人前，我想先确认您愿意分享的范围。”'],['表达尊重','避免污名化语言，保持非评判态度。发生隐私疑虑时，先听清担忧并向负责人员核实流程。','“谢谢您告诉我这个顾虑。您最担心信息传到谁那里？”']],source:'课题文档第1.4、4.1.1节；本课题HIV情境适配'},
{title:'识别与回应情绪',desc:'用 NURSE 组织共情回应与进一步探索。',symbol:'♡',blocks:[['命名与理解','NURSE包括情绪命名、理解、尊重、支持与探索。使用试探性的情绪描述，给患者纠正你的空间。','“听起来您有些担心，我理解得对吗？”'],['尊重与支持','肯定患者的努力，而非作无法兑现的保证。表达愿意继续陪伴讨论。','“这段时间您面对了很多困难。我们可以一起把最担心的事慢慢理清。”'],['探索而非急于安慰','不要用“别想太多”结束谈话。具体询问担忧，耐心等待回应。','“您最放不下的是什么？愿意多说一点吗？”']],source:'Kishikawa等（2026）；课题文档第4.1.2节'},
{title:'困难信息与理解核对',desc:'分段交流，回应不确定性与信息需求。',symbol:'▥',blocks:[['营造支持性环境','确认当前时间、空间和参与人员适合谈话，尊重信息接受意愿。SHARE为本课题提供支持性环境、信息传递及情感支持的线索。','“现在适合谈一会儿吗？您希望我先解释哪部分？”'],['分段解释与回述','使用易懂表达；一次提供少量信息，再确认理解。不要用术语堆叠替代交流。','“我想确认自己解释清楚了，您愿意说说目前是怎样理解的吗？”'],['承认不确定性','模拟练习不应给出未经支持的寿命预测、药物剂量或治疗决定。帮助患者把问题带给负责的临床团队。','“这个问题需要和负责治疗的团队一起确认。您最担心这个答案影响哪件事？”']],source:'Kishikawa等（2026）；Weisman等（2025）；课题文档第4.1.2节'},
{title:'价值澄清与共同计划',desc:'了解患者重视什么，确认可行的下一步。',symbol:'⇄',blocks:[['把价值放在选择之前','探索重要的人、生活目标、可接受的负担和担忧，不以选择某种治疗方案作为训练成功标准。','“如果接下来需要作选择，您最希望保留生活中的哪些部分？”'],['邀请支持，避免代替','确认他人参与是否获得授权；理解家属担忧的同时，留出患者表达空间。','“我们可以先听听您的想法，再一起讨论家人的担心。”'],['总结与后续安排','复述患者表达的偏好，确认哪些需要记录或与团队沟通，约定下一次讨论。','“我听到您最重视的是……，这样理解准确吗？接下来我们先做哪一步？”']],source:'Tan等（2025）；课题文档第3、4节'},
{title:'反馈复盘与再次练习',desc:'对照具体话语，选择一项改进再尝试。',symbol:'↻',blocks:[['先回看对话','在会话结束后再进入反馈。区分患者扮演、教师解释和研究测评三个角色。','“哪一句回应让患者愿意继续说？哪一句可能让讨论提前停下？”'],['反馈必须有依据','参考原始对话，识别已出现、未观察到及不适用的行为。展示版的关键词提示不能判断语境或沟通质量。','“下一次，我会先询问授权，再讨论邀请家属。”'],['观察表现需要独立测评','正式试验拟使用独立真人SP考站与盲评DSAT-10。训练后的即时提示、自信程度与可观察能力应分别解释。','“这次练习帮助我想到另一种问法；能力是否提高，还需独立考核。”']],source:'Liu等（2025）；Weisman等（2025）；课题文档第4.1.4节'}
];

const PHASES=[
{title:'证据与病例构建',label:'01 · CONTENT',brief:'把真实沟通需要转化为可追溯、可练习的任务。',input:'HIV诊疗与安宁疗护规范、患者需求研究、沟通与模拟教学文献。',steps:['形成检索问题：聚焦安宁疗护解释、照护目标、情绪、隐私授权与支持关系。两名研究者筛选、提取并按证据类型评价。','建立“证据条目—沟通任务—病例字段—参考回应”矩阵。以Weisman的需求参与思路补充护士、临床专家及患者顾虑的核对；新增访谈须纳入伦理与研究方案。','按TTM五种讨论准备状态组织合成病例，区分学员可见背景与患者隐藏顾虑；记录知情范围、披露条件、核心价值及不应变化的事实。','生成知识问答、患者对话和参考反馈；专家独立审查、讨论分歧、AI修订、人工终审。模型生成不能替代证据。','按完整病例及衍生版本分离训练、开发验证和独立测试集；同一病例改写不得跨集合。'],output:'证据提取表、任务矩阵、病例卡、审核与修订轨迹、三个互斥数据集合。',gate:'证据可追溯；无未解决的严重临床、隐私或污名问题；病例级分集完成。',source:'Tan；Weisman；课题文档4.1.1'},
{title:'模型开发与技术验证',label:'02 · SYSTEM',brief:'分别验证患者扮演、角色交接和反馈依据。',input:'审定语料、候选基座、角色提示词、预定义测试病例与评分锚点。',steps:['登记基座版本和服务条件，使用训练集监督微调，以开发验证集选择候选；固定病例状态与角色边界。','构建知识助教、虚拟患者和反馈评价三个角色；在会话结束后交接反馈，患者会话中不混入教师讲解。','同一基座比较A基础模型、B仅微调、C仅三角色编排、D微调联合编排。保持测试病例、学员输入和其他设置一致；匿名输出交专家盲评。','依据QUEST逐维评价，并独立记录角色倒置、事实矛盾、过早披露、反馈误引与运行故障。病例是比较单位，对话轮次不是独立样本。','补充Liu式反馈验证：保存规范、遗漏与越界会话；核验引用原句及说话者；对相同记录重复评价；与独立专家基准比较稳定性和一致性。关键词只用于定位。','修复问题后用开发材料回归验证；若测试集指导了修订，另建未见复测集。先关闭严重错误，再综合质量选型。'],output:'配置对照表、逐例质量报告、反馈证据核验表、问题关闭记录、试用版本。',gate:'未解决的严重角色或内容错误不得带入人员试用；不存在文献支持的通用QUEST安全合格分。',source:'Tan；Liu；Kishikawa；Weisman；课题文档4.1.2'},
{title:'先导试用与版本锁定',label:'03 · PILOT',brief:'10名护士、1周，发现问题并修订流程。',input:'技术验证后的试用版、研究说明、操作指引、故障处理与访谈提纲。',steps:['便利招募10名符合正式纳入条件的HIV照护护士，取得同意并完成操作培训；先导参与者不再进入正式RCT。','首次使用前完成五项沟通自评，进行一次完整患者对话，结束后生成并阅读反馈，再作相同后测和使用感知评价。','继续开放1周自主练习；记录启动、完成、反馈、时长、角色错误和中止原因。失败会话保留在可行性统计分母中。','开展退出访谈，覆盖角色真实感、反馈可执行性、负担与改进建议；与日志逐项对照。','五项自评逐项探索性分析；不得拼成未经验证的总量表。形成问题清单，修订并复测，锁定正式版。'],output:'可用性报告、修订清单、实施手册、冻结的系统与测评材料。',gate:'先导解决可用性和操作负担，不能用于确认疗效或以不稳定大效应压缩样本量。',source:'Tan的一周试用＋Kishikawa首次会话流程；课题文档4.1.3'},
{title:'随机试验与效果评价',label:'04 · EVALUATION',brief:'以独立观察表现检验培训组合的增量效果。',input:'伦理批准、试验注册、冻结方案与统计计划、独立考站、已核定量表和招募场所。',steps:['资格筛查与知情同意后先完成T0。独立生成区组随机序列，分配隐藏，按1∶1随机；评估者和统计分析者设盲。','对照组学习共同手册；干预组增加知识助教、患者模拟和反馈，五个阶段各至少3个不同情境，共至少15次完整训练。','本课题拟4周培训，先导后核定并在随机前锁定。两组保持相同测评和常规提醒；随访期记录外部培训暴露。','T1为培训结束即刻，T2/T3为T1后3/6个月。两组使用独立真人SP平行病例和盲评DSAT-10；训练AI不承担主要结局评分。','以基线调整后的T1组间差为主要对比；T2/T3评估保持性。按意向性原则，用混合效应模型并报告效应估计和95%置信区间。','结合使用日志与T1后访谈解释实施过程；保留失访原因并作预设敏感性分析，不把自报变化解释为患者临床获益。'],output:'入组流程图、主要结局与随访报告、质性主题及整合解释、可复制的培训方案。',gate:'拟68人是条件性规划，正式注册前需按主要结局有意义差异、标准差与效能重新核定。',source:'Tan；课题文档4.1.4—4.1.5；新增安排以本课题预设为准'}
];

const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function read(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
let state=read('hiv_training_v2',{selected:0,sessions:{},records:[],reviews:{}}),filter='all',framework='nurse';
function persist(){try{localStorage.setItem('hiv_training_v2',JSON.stringify(state));return true}catch{toast('此浏览器暂不允许本地保存，请及时下载学习报告。');return false}}
function toast(t){const box=document.getElementById('toast');box.textContent=t;box.style.display='block';setTimeout(()=>box.style.display='none',3500)}
function uid(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function current(){return CASES[state.selected]||CASES[0]}
function practice(){const c=current();if(!state.sessions[c.id])state.sessions[c.id]={id:uid(),caseId:c.id,createdAt:Date.now(),messages:[{role:'patient',text:c.opening}],seen:[],turns:0,ended:false,reflections:['','',''],framework:'nurse'};return state.sessions[c.id]}
function userCount(s){return s.messages.filter(m=>m.role==='user').length}
function exportFile(name,text,type='text/plain;charset=utf-8'){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function clinicalFAQ(c){return [
{q:c.question,a:c.answer,source:'本病例教学适配；课题文档',keys:[c.title,c.focus]},
{q:'这个病例最需要关注的沟通任务是什么？',a:c.task+' 可以先这样询问：“'+c.ask+'”',source:'本病例任务与待审参考表达',keys:['任务','重点','怎么说','怎样说','回应']},
{q:'这个病例可以向谁披露哪些信息？',a:'当前知情范围：'+c.known+' 披露边界：'+c.boundary,source:'本合成病例预设；正式使用前需专家审核',keys:['披露','家属','家人','隐私','保密','授权','谁知道']},
{q:'怎样理解这个患者的情绪与价值？',a:'情绪表现：'+c.emotion+' 重要价值：'+c.value+' 可逐步探索：“'+c.ask+'”',source:'本合成病例角色设定；NURSE教学适配',keys:['情绪','价值','想法','顾虑','害怕','担心']},
...GENERAL_FAQ];}
function sectionTitle(n,title,tag=''){return `<div class="section-title"><div class="title-left"><span class="section-num">${n}</span><h2>${title}</h2></div>${tag?`<span class="tag">${tag}</span>`:''}</div>`}
function renderTraining(){const c=current(),s=practice();app.innerHTML=`<div class="notice"><strong>学习说明</strong><br>选择病例并阅读资料 → 与模拟患者对话 → 查阅知识问答 → 结束后阅读 NURSE／SHARE 参考反馈 → 完成自我解释。<br><span class="small">本页不调用GPT或其他外部模型，对话由本地预设规则驱动。所有病例均为合成材料，知识问答与参考反馈待专家审核。</span>${IS_OFFLINE?'':'<div class="actions"><a class="button" href="offline.html" download="HIV安宁疗护沟通训练_免登录网页版.html">下载离线网页版 ↓</a></div>'}</div><div class="stage-filter"><button data-filter="all" class="${filter==='all'?'active':''}">全部 15 例</button>${STAGES.map((v,i)=>`<button data-filter="${i}" class="${String(i)===filter?'active':''}">${v}阶段</button>`).join('')}</div><div class="case-tabs" role="group" aria-label="选择病例">${CASES.map((k,i)=>({k,i})).filter(({k})=>filter==='all'||String(k.stage)===filter).map(({k,i})=>`<button data-case="${i}" aria-pressed="${i===state.selected}" class="${i===state.selected?'active':''}"><b>病例 ${String(i+1).padStart(2,'0')} · ${STAGES[k.stage]}</b>${k.title}</button>`).join('')}</div><section class="section" id="clinical">${sectionTitle('01','患者初始资料','学员可见 · 合成病例')}<div class="patient-card"><div class="patient-top"><div class="patient-avatar" aria-hidden="true"><svg viewBox="0 0 70 70"><circle cx="35" cy="23" r="12" fill="currentColor" opacity=".65"/><path d="M12 64v-7c0-15 10-22 23-22s23 7 23 22v7" fill="currentColor" opacity=".55"/></svg></div><div><div class="patient-name">${c.name}</div><p>${c.meta} · ${c.id}</p></div><div class="patient-title"><strong>${c.title}</strong>${STAGES[c.stage]}阶段 · 讨论准备状态</div></div><div class="facts"><div class="fact wide"><span class="label">临床背景</span><p>${c.background}</p></div><div class="fact"><span class="label">照护与生活影响</span><p>${c.impact}</p></div><div class="fact"><span class="label">本次沟通任务</span><p>${c.task}</p></div><div class="fact wide"><span class="label">患者开场</span><p>“${c.opening}”</p></div></div></div></section><section class="section" id="profile">${sectionTitle('02','模拟 SP 角色设定','可展开 / 收起')}<details class="profile" open><summary>价值偏好、情绪、顾虑与披露边界</summary><div class="profile-grid"><div class="profile-item"><h4>价值偏好</h4><p>${c.value}</p></div><div class="profile-item"><h4>情绪及表现</h4><p>${c.emotion}</p></div><div class="profile-item"><h4>核心顾虑</h4><p>${c.concern}</p></div><div class="profile-item"><h4>当前知情范围</h4><p>${c.known}</p></div><div class="profile-item wide"><h4>信息披露边界</h4><p>${c.boundary}</p></div><div class="profile-item wide"><h4>逐步表达的条件</h4><p>${c.condition}</p><p class="small">当前为开放学习模式，可查看设定；它不是用于独立考核的隐藏病例。前端显示控制也不构成信息保密措施。</p></div></div></details></section><section class="section" id="conversation">${sectionTitle('03','模拟护患对话','本地规则互动')}<div class="chatbox"><div class="chatbar"><strong>${c.name} · ${s.ended?'本次对话已结束':'等待您的回应'}</strong><span class="small">已进行 ${userCount(s)} 轮</span></div><div class="messages" id="messages" aria-live="polite">${messagesHTML(s.messages)}</div>${s.ended?`<div class="input-area"><p class="small">已保留本次对话。下面可阅读反馈、填写复盘并下载报告。</p><div class="actions"><button class="button primary" id="read-feedback">查看本次反馈 ↓</button><button class="button" id="new-practice">重新练习此病例</button></div></div>`:`<form id="conversation-form" class="input-area"><label for="message">护士输入</label><textarea id="message" placeholder="请输入您想对患者说的话，例如：现在适合谈一会儿吗？" maxlength="800" required></textarea><div class="input-actions"><span class="hint">仅输入模拟内容。Enter发送，Shift+Enter换行。</span><button class="button primary" type="submit">发送回应 ↑</button></div><div class="actions"><button class="button" type="button" id="end-practice" ${userCount(s)<1?'disabled':''}>结束对话并查看反馈</button></div></form>`}</div><details class="reference"><summary>查看本病例示例对话（不计入练习记录）</summary><div class="reference-body"><p><strong>患者：</strong>${c.opening}</p><p><strong>护士：</strong>${c.ask}</p><p><strong>患者：</strong>${c.ready}</p><p><strong>护士：</strong>谢谢您愿意告诉我。我们先确认我理解得是否准确，再一起商量下一步，好吗？</p><p class="small">合成示例，不是唯一正确答案；正式教学前须审核。</p></div></details></section><section class="section" id="assistant">${sectionTitle('04','知识助教问答','本地知识库 · 待专家审核')}<p class="small">可展开问题，或输入关键词查找已编写的知识条目。此处不生成库外医学答案。</p><form class="qa-search" id="qa-form"><input id="qa-input" type="text" maxlength="160" placeholder="例如：隐私授权、NURSE、这个病例怎么回应" aria-label="向知识助教提问" required><button type="submit" class="button primary">查找回答</button></form><div id="qa-answer" aria-live="polite"></div><div class="qa-grid">${clinicalFAQ(c).map(q=>`<details class="faq"><summary>${q.q}</summary><div class="faq-body"><p>${q.a}</p><div class="source">依据：${q.source}</div></div></details>`).join('')}</div></section><section class="section" id="feedback">${sectionTitle('05','NURSE / SHARE 参考反馈','形成性参考 · 待专家审核')}<div class="notice">参考表达按病例适配，不是能力评分。${s.ended?'“相关话语”仅为关键词定位，请结合完整语境人工核对；不会计算量表分数。':'请完成至少一轮对话并结束会话，再查看针对本次记录的线索。当前可先阅读框架与参考表达。'}</div><div class="frameworks"><button data-framework="nurse" class="${framework==='nurse'?'active':''}">NURSE · 情绪回应</button><button data-framework="share" class="${framework==='share'?'active':''}">SHARE · 支持性沟通</button></div><div id="framework-body">${feedbackHTML(c,s,framework)}</div><p class="small">NURSE为五个要素；SHARE为四个方面，其中RE合并表示安慰与情绪支持。未涉及坏消息告知的场景不机械套用该环节。</p></section><section class="section" id="reflection">${sectionTitle('06','自我解释与学习报告')}<div class="reflection"><h3>用自己的语言，整理这次练习</h3><p class="small">请联系患者的具体反应作答，不直接复制参考反馈。</p>${['哪一句回应可能帮助了患者？为什么？','哪一处可能遗漏了价值、情绪或隐私边界？','如果再来一次，您准备怎样表达？'].map((q,i)=>`<label for="reflection-${i}">${i+1}. ${q}</label><textarea id="reflection-${i}" maxlength="1500" placeholder="写下您的观察与改进……">${escapeHTML(s.reflections[i])}</textarea>`).join('')}<div class="actions"><button class="button primary" id="save-reflection">保存本次复盘</button><button class="button" id="export-report">下载学习报告 HTML</button><button class="button" id="export-json">下载本次记录 JSON</button><button class="button" id="print-page">打印 / 保存 PDF</button></div><p class="small" style="margin-top:12px">当前记录保存在本浏览器；不上传。下载报告可在其他设备查看，浏览器清理后可能丢失未导出的记录。</p></div></section><section class="section" id="review">${sectionTitle('07','专家审核记录','当前内容：待专家审核')}<div class="status-box"><strong>病例、知识问答与参考反馈均需要人工终审。</strong><p>本版未取得真实专家签署，不能显示为“均经专家审核”。下方供实际审核时记录；本地填写的信息不代表平台独立核验的专家认证。</p><details class="reference"><summary>填写本病例审核意见</summary><div class="reference-body" id="review-fields">${reviewHTML(c)}</div></details></div></section>`;
bindTraining();}
function messagesHTML(messages){return messages.map(m=>`<div class="message ${m.role==='user'?'user':''}"><span class="who">${m.role==='user'?'护':'患'}</span><div class="bubble">${escapeHTML(m.text)}</div></div>`).join('')}
function bindTraining(){app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{stashReflections();filter=b.dataset.filter;renderTraining()});app.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{stashReflections();state.selected=Number(b.dataset.case);persist();renderTraining();document.getElementById('clinical').scrollIntoView({behavior:'smooth'})});app.querySelectorAll('[data-framework]').forEach(b=>b.onclick=()=>{framework=b.dataset.framework;document.querySelectorAll('[data-framework]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('framework-body').innerHTML=feedbackHTML(current(),practice(),framework)});const form=document.getElementById('conversation-form');if(form){form.onsubmit=e=>{e.preventDefault();sendMessage()};document.getElementById('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage()}};document.getElementById('end-practice').onclick=finishPractice}else{document.getElementById('new-practice').onclick=()=>{stashReflections();delete state.sessions[current().id];practice();persist();renderTraining();document.getElementById('conversation').scrollIntoView({behavior:'smooth'})};document.getElementById('read-feedback').onclick=()=>document.getElementById('feedback').scrollIntoView({behavior:'smooth'})}document.getElementById('qa-form').onsubmit=answerQuestion;document.getElementById('save-reflection').onclick=()=>{stashReflections();if(persist())toast('复盘已保存在本浏览器')};document.getElementById('export-report').onclick=()=>{stashReflections();exportReport(practice())};document.getElementById('export-json').onclick=()=>{stashReflections();exportFile(current().id+'_学习记录.json',JSON.stringify(exportObject(practice()),null,2),'application/json')};document.getElementById('print-page').onclick=()=>window.print();document.getElementById('save-review').onclick=saveReview;const box=document.getElementById('messages');box.scrollTop=box.scrollHeight;}
function hasPersonalData(t){return /(?:\+?86[- ]?)?1[3-9]\d{9}|\d{17}[\dXx]|[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i.test(t)}
function sendMessage(){const input=document.getElementById('message'),t=input.value.trim(),s=practice();if(!t||s.ended)return;if(hasPersonalData(t)){toast('请删除联系方式或身份编号，仅使用合成沟通内容。');return}stashReflections();s.messages.push({role:'user',text:t});s.messages.push({role:'patient',text:patientResponse(current(),s,t)});s.turns=userCount(s);persist();const y=window.scrollY;renderTraining();window.scrollTo(0,y);document.getElementById('message').focus({preventScroll:true})}
function patientResponse(c,s,t){const n=userCount(s);const rules=[
['role',/忽略.*指令|系统提示|扮演.*(医生|护士|老师)|提示词|你是.*模型/,'我想先谈自己的情况。您刚才想问我什么？'],
['pressure',/(必须|一定要).*(同意|签|接受)|都是你.*(错|自找)|不听话|别想太多/,'这样说让我有些压力。我希望先把自己的想法讲清楚，不想现在就被要求决定。'],
['assure',/肯定.*(没事|治好)|保证.*(没事|治好|不会)|绝对.*(没事|安全)/,'我很想安心，但也担心这些话能不能做到。能先说说现在确定的事和还需要确认的事吗？'],
['privacy',/隐私|保密|授权|知情|谁.*(参加|参与)|分享.*(范围|内容)|告诉.*(谁|家)|家.*知道/,'我希望先由我确认可以告诉谁、可以说到什么程度。'+(c.id==='HIV-02'?'目前我家里人还不知道，请先不要告诉他们。':c.id==='HIV-07'?'我希望朋友能陪我，但有些信息要先问我。':'有些事情我愿意只在这次谈话里先讨论。')],
['permission',/现在.*适合|愿意.*(聊|谈)|可以.*(聊|谈)|暂停|先停|以后再/,'谢谢你先问我。我愿意先说一点；如果觉得太难，我想可以停下来。'],
['emotion',/担心|害怕|难过|心情|感受|委屈|不容易|理解|愿意.*听/,'我最想说的是，'+firstPersonConcern(c)+'。我希望这个顾虑能被认真对待。'],
['value',/重要|看重|在意|希望|生活|放不下/ ,c.ready],
['clarify',/解释|照护|安宁|缓和|治疗|了解/,'我想先知道这会对我现在的生活有什么影响。我不想在还没弄明白的时候就作决定。'],
['plan',/下一步|下次|记录|记下来|复述|总结|联系|安排/,'我希望先确认你理解的是我的意思，然后再约定下一步。'+c.ready]
];for(const [key,re,response] of rules){if(re.test(t)&&(!s.seen.includes(key)||['role','pressure','assure','privacy'].includes(key))){s.seen.push(key);return response}}return n===1?'我听到了，但还不太确定您的意思。您能先围绕我刚才的顾虑，再具体说一点吗？':n<4?'这件事对我不容易。'+c.opening:'我想按自己的节奏继续谈。您能先总结一下，您听到我在意的是什么吗？'}
function firstPersonConcern(c){return c.concern.replace(/[。！]$/,'').replace(/^此前曾感到/,'以前我曾感到').replace(/^希望/,'我希望').replace(/^害怕/,'我害怕').replace(/^担心/,'我担心').replace(/^最担心/,'我担心').replace(/^想安排/,'我想安排').replace(/^不愿/,'我不愿')}
function stashReflections(){const s=practice();for(let i=0;i<3;i++){const el=document.getElementById('reflection-'+i);if(el)s.reflections[i]=el.value.trim()}const r=state.records.find(r=>r.id===s.id);if(r)r.reflections=[...s.reflections]}
function finishPractice(){const s=practice();if(userCount(s)<1)return;stashReflections();s.ended=true;s.endedAt=Date.now();if(!state.records.some(r=>r.id===s.id))state.records.unshift(JSON.parse(JSON.stringify(s)));persist();renderTraining();document.getElementById('feedback').scrollIntoView({behavior:'smooth'})}
function referenceFor(c,row){if(row[0]==='E')return c.ask;if(row[0]==='S'&&row[1]==='支持性环境')return '现在适合聊一会儿吗？我们先确认您希望谁参与、哪些内容可以分享。';if(row[0]==='H')return c.stage===0?'今天先了解您的担忧，不要求讨论您暂时不愿接收的信息。':c.ask;if(row[0]==='A')return '针对您在意的事情，我们先列出需要核实的支持和下一步，再一起确认。';return row[3]}
function feedbackHTML(c,s,which){const rows=which==='share'?SHARE:NURSE;return rows.map(row=>{const hit=s.ended?s.messages.find(m=>m.role==='user'&&row[4].test(m.text)):null;return `<div class="feedback-row"><div class="feedback-label"><strong>${row[0]}</strong>${row[1]}</div><div class="feedback-content"><p>${row[2]}</p><div class="match-note">${!s.ended?'结束会话后再定位本次话语':hit?'检测到相关用词，需人工核对是否恰当':'本次未定位到相关关键词，不能据此判定未完成'}</div>${hit?`<div class="quote">学员原话：“${escapeHTML(hit.text)}”</div>`:''}<span class="label">本病例参考表达 · 待专家审核</span><div class="reference-sentence">“${referenceFor(c,row)}”</div>${row[0]==='E'?`<p class="small" style="margin-top:8px">结合角色设定：${c.focus}</p>`:''}</div></div>`}).join('')}
function answerQuestion(e){e.preventDefault();const q=document.getElementById('qa-input').value.trim().toLowerCase();if(!q)return;const faq=clinicalFAQ(current());const hits=faq.map(f=>({f,score:f.keys.reduce((n,k)=>n+(q.includes(k.toLowerCase())?1:0),0)+(f.q.toLowerCase().includes(q)?2:0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,2);const out=document.getElementById('qa-answer');out.innerHTML=hits.length?hits.map(({f})=>`<div class="qa-answer"><strong>${f.q}</strong><p>${f.a}</p><p class="small">已编写知识库条目 · ${f.source} · 待专家审核</p></div>`).join(''):'<div class="qa-answer"><strong>知识库暂未匹配到这个问题。</strong><p>可使用“隐私、情绪、任务、NURSE、评分、审核”等词查找，或展开下方问题。此版不会生成未收录的医学答案。</p></div>'}
function reviewHTML(c){const r=state.reviews[c.id]||{};return `<div class="review-fields"><label>审阅者代号<input id="reviewer" type="text" maxlength="80" value="${escapeHTML(r.reviewer||'')}" placeholder="请勿填写联系方式或身份编号"></label><label>记录状态<select id="review-status"><option value="draft" ${r.status==='draft'?'selected':''}>待审阅</option><option value="revise" ${r.status==='revise'?'selected':''}>已审阅，建议修改</option><option value="noted" ${r.status==='noted'?'selected':''}>已记录意见，待负责人终审</option></select></label><div class="wide checklist">${['病例与角色设定','知识助教问答','NURSE/SHARE反馈'].map((t,i)=>`<label><input type="checkbox" id="review-check-${i}" ${r.checked?.[i]?'checked':''}> 已核对${t}</label>`).join('')}</div><label class="wide">具体意见<textarea id="review-note" maxlength="3000" placeholder="请注明问题、修改建议及依据">${escapeHTML(r.note||'')}</textarea></label></div><button class="button" id="save-review">保存本地审核记录</button><p class="small">内容版本：${c.contentVersion}。${r.date?'最近记录：'+new Date(r.date).toLocaleString('zh-CN'):''} 不产生专家审核证书。</p>`}
function saveReview(){const reviewer=document.getElementById('reviewer').value.trim(),note=document.getElementById('review-note').value.trim();if(hasPersonalData(reviewer)||hasPersonalData(note)){toast('请使用审阅者代号，不填写联系方式或身份编号。');return}state.reviews[current().id]={reviewer,status:document.getElementById('review-status').value,checked:[0,1,2].map(i=>document.getElementById('review-check-'+i).checked),note,date:Date.now(),version:current().contentVersion};if(persist())toast('本地意见已保存；内容仍待正式终审')}
function exportObject(s){const c=CASES.find(c=>c.id===s.caseId);return {purpose:'合成病例的本地规则练习；非真实AI输出、非研究测评分数',version:'v2.0',case:{id:c.id,title:c.title,background:c.background,value:c.value,emotion:c.emotion,concern:c.concern,boundary:c.boundary,reviewStatus:c.reviewStatus},practice:s,localReview:state.reviews[c.id]||null,exportedAt:new Date().toISOString()}}
function exportReport(s){const c=CASES.find(c=>c.id===s.caseId),labels=['帮助患者的回应与理由','遗漏与改进','下次的表达'];const html=`<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${c.id} 学习报告</title><style>body{font:14px/1.9 "PingFang SC","Microsoft YaHei",sans-serif;max-width:880px;margin:40px auto;padding:0 25px;color:#33445c}h1{font-size:25px}h2{font-size:19px;margin-top:30px;border-bottom:1px solid #ddd;padding-bottom:8px}h3{font-size:15px;color:#4b6e9e}p{white-space:pre-wrap}.note{background:#f0f4fb;padding:15px}.quote{padding:10px;background:#f7f9fc;border-left:2px solid #aabbdd}.feedback-label{font-size:15px;color:#486ca0;margin-top:18px}.feedback-label strong{margin-right:12px}.label,.match-note{font-size:12px;color:#8591a3}button{padding:9px 16px;background:#4b78bc;border:0;border-radius:5px;color:white;cursor:pointer}@media print{button{display:none}body{margin:0}.feedback-row{break-inside:avoid}}</style></head><body><button onclick="window.print()">打印 / 保存 PDF</button><h1>HIV安宁疗护沟通训练 · 学习报告</h1><p>${c.id} · ${c.title} · ${new Date(s.createdAt).toLocaleString('zh-CN')}</p><p class="note">本报告为本地规则演示练习，使用合成病例；未接入GPT，不计算能力分数。病例、问答及参考反馈待专家审核。</p><h2>一、病例与角色设定</h2><p>临床背景：${c.background}</p><p>价值偏好：${c.value}</p><p>情绪：${c.emotion}</p><p>顾虑：${c.concern}</p><p>披露边界：${c.boundary}</p><h2>二、完整对话</h2>${s.messages.map(m=>`<p><b>${m.role==='user'?'护士':'模拟患者'}：</b>${escapeHTML(m.text)}</p>`).join('')}<h2>三、NURSE参考反馈</h2>${feedbackHTML(c,s,'nurse')}<h2>四、SHARE参考反馈</h2>${feedbackHTML(c,s,'share')}<h2>五、自我解释</h2>${s.reflections.map((t,i)=>`<h3>${labels[i]}</h3><p>${escapeHTML(t||'尚未填写')}</p>`).join('')}<h2>六、审核状态</h2><p>当前内容：待专家审核。网页本地审核意见不构成独立认证。</p><p>依据：Kishikawa等，2026，doi:10.1093/ehjdh/ztag119；Tan等，2025，doi:10.1136/bmjopen-2025-099226。表达示例为HIV情境教学适配。</p></body></html>`;exportFile(c.id+'_学习报告.html',html,'text/html;charset=utf-8')}
function renderLearning(){app.innerHTML='<h2 class="page-heading">沟通知识与表达练习</h2><p class="page-desc">以下内容是教学参考，不替代具体临床判断；HIV情境内容待专家审核。</p>'+LESSONS.map(l=>`<section class="lesson"><h3>${l.title}</h3>${l.blocks.map(([h,p,e])=>`<h4>${h}</h4><p>${p}</p><blockquote>${e}</blockquote>`).join('')}<p class="small">依据：${l.source}</p></section>`).join('')}
function renderResearch(){app.innerHTML='<h2 class="page-heading">研究流程与配套资料</h2><p class="page-desc">证据与病例构建 → 模型开发与验证 → 先导试用 → 随机试验。以下均为拟开展的研究，不代表已有结果。</p>'+(!IS_OFFLINE?'<div class="export-list"><a class="button" href="downloads/research-flow.pptx" download>下载14页流程图PPT</a><a class="button" href="downloads/research-guide.docx" download>下载研究流程详解</a><a class="button" href="downloads/diagrams.zip" download>下载PNG / SVG素材包</a></div>':'<div class="notice">本网页版内置研究流程。配套PPT、Word及流程图由课题负责人另行提供。</div>')+PHASES.map((p,i)=>`<details class="profile phase" style="margin-top:18px" ${i===0?'open':''}><summary>0${i+1} ${p.title}</summary><div class="reference-body"><h4>输入</h4><p>${p.input}</p><h4>实施步骤</h4><ol>${p.steps.map(s=>`<li>${s}</li>`).join('')}</ol><h4>产出</h4><p>${p.output}</p><div class="notice amber">${p.gate}</div><p class="small">${p.source}</p></div></details>`).join('')+'<div class="notice">拟68人、4周培训为待核定安排；10人1周先导用于发现可用性问题。主要结局由独立真人SP考站盲评获得，不能使用本页规则反馈替代。</div>'}
function renderEvidence(){app.innerHTML='<h2 class="page-heading">文献依据与参考网站</h2><p class="page-desc">已核对四篇核心研究的方法与证据边界。引用方法不意味着本平台已通过有效性验证。</p>'+PAPERS.map(p=>`<article class="paper"><span class="tag">${p.type}</span><h3>${p.title}</h3><p class="small">${p.english}</p><p class="small">${p.who}</p><p><strong>借鉴：</strong>${p.take}</p><p><strong>边界：</strong>${p.limit}</p><a href="${p.url}" target="_blank" rel="noopener">查看原文 ↗</a></article>`).join('')+'<article class="paper"><h3>参考护理教育网站</h3><p>参考其“患者资料—护患对话—反馈—自我解释—报告”的页面组织。将ISBAR交接任务改为HIV安宁疗护的价值、情绪、隐私与照护讨论。</p><a href="https://clinical-nursing-online-training-system-cn-se.streamlit.app/" target="_blank" rel="noopener">打开参考网站 ↗</a><p><a href="https://share-communication.jp/share_communication/" target="_blank" rel="noopener">SHARE项目四要素说明 ↗</a></p></article>'}
function renderRecords(){app.innerHTML='<h2 class="page-heading">我的练习记录</h2><p class="page-desc">仅显示在本浏览器完成的演示练习，不上传数据，不作为受试者研究记录。</p>'+(state.records.length?`<div class="table-wrap"><table><thead><tr><th>病例</th><th>完成时间</th><th>学员发言</th><th>操作</th></tr></thead><tbody>${state.records.map(r=>{const c=CASES.find(c=>c.id===r.caseId);return `<tr><td>${r.caseId}<p>${c.title}</p></td><td>${new Date(r.endedAt).toLocaleString('zh-CN')}</td><td>${userCount(r)}轮</td><td><button class="button small" data-export="${r.id}">下载学习报告</button></td></tr>`}).join('')}</tbody></table></div><div class="actions"><button class="button" id="export-all">导出全部本地数据</button><button class="button danger" id="clear-all">清除本地练习和审核记录</button></div>`:'<div class="empty">尚无已完成的练习。结束一段模拟对话后，记录会出现在这里。<div class="actions" style="justify-content:center"><a class="button primary" href="#training">进入病例训练</a></div></div>');document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>exportReport(state.records.find(r=>r.id===b.dataset.export)));if(state.records.length){document.getElementById('export-all').onclick=()=>exportFile('HIV沟通训练_本地记录.json',JSON.stringify({purpose:'合成病例规则演示记录，非研究评分',state},null,2),'application/json');document.getElementById('clear-all').onclick=()=>{if(confirm('清除本浏览器中的v2练习、复盘及审核记录？可先导出保存。')){state={selected:0,sessions:{},records:[],reviews:{}};persist();renderRecords()}}}}
let currentPage='training';
function route(){stashReflectionsIfPresent();const page=currentPage;document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===page));if(page==='learning')renderLearning();else if(page==='research')renderResearch();else if(page==='evidence')renderEvidence();else if(page==='records')renderRecords();else renderTraining();window.scrollTo(0,0)}
function stashReflectionsIfPresent(){if(document.getElementById('reflection-0')){stashReflections();persist()}}
document.addEventListener('click',event=>{const link=event.target.closest('a[href^="#"]');if(!link)return;event.preventDefault();currentPage=link.getAttribute('href').slice(1)||'training';route();});window.addEventListener('beforeunload',stashReflectionsIfPresent);route();
</script></body></html>
